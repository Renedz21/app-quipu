minimumReleaseAge: 1440
trustPolicy: no-downgrade
# Versiones ya pinneadas en el lockfile con evidencia de trust más débil
# que releases anteriores; excluidas para no bloquear installs reproducibles.
trustPolicyExclude:
  - semver@6.3.1
  - undici-types@6.21.0
allowBuilds:
  '@sentry/cli': false
  core-js: false
  esbuild: true
  sharp: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
minimumReleaseAgeExclude:
  - convex@1.43.0
