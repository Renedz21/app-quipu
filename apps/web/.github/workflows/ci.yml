name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm debe instalarse ANTES de setup-node: `cache: pnpm` necesita pnpm
      # en el PATH. action-setup lee la versión del campo `packageManager`.
      - name: Install pnpm
        uses: pnpm/setup@v2

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Biome es la única herramienta de format + lint del repo (no ESLint/Prettier).
      - name: Format + lint (Biome)
        run: pnpm ci:quality

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test run
